name: Android CI/CD Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle Version
        run: gradle --version

      - name: Prepare Keystore for Release Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding fallback debug.keystore.base64..."
            base64 -d debug.keystore.base64 > my-upload-key.jks || true
          fi
          
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=RDA, OU=Academy, O=RDA, L=Delhi, S=Delhi, C=IN"
          fi

      - name: Build Release APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleRelease --no-daemon

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDA-Academy-Release-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Determine Release Tag Name
        id: tag_name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_NAME="v${VERSION_NAME:-1.0.0}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "RDA Physical Academy Release ${{ env.TAG_NAME }}"
          body: |
            ## RDA Physical Academy Official Release ${{ env.TAG_NAME }}
            
            ### What's Changed
            - Production release build generated automatically by GitHub Actions
            - Real-time Firebase Firestore synchronization enabled
            - In-app automatic update checker and downloader
            - Offline data persistence with zero data loss
            
            ### Installation Instructions
            1. Download the `.apk` file attached below.
            2. Open the file on your Android device to install or update the app.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
